name: Testar 14 Agentes

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  testar:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
         - name: Verificar HF_TOKEN
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ERRO: HF_TOKEN nao encontrado"
            exit 1
          fi
          echo "HF_TOKEN configurado com sucesso"  
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar main
        run: python main.py

      - name: Testar orquestrador
        run: python orquestrador.py
